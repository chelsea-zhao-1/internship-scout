name: Check Internship Postings

on:
  schedule:
    - cron: '0 11 * * *'   # 11:00 UTC = 7:00 AM EDT / 6:00 AM EST (GitHub may delay 30–90 min)
  workflow_dispatch:         # Allow manual trigger for testing

jobs:
  check-jobs:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # Required for git-auto-commit-action

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        run: python main.py
        env:
          GMAIL_CREDENTIALS: ${{ secrets.GMAIL_CREDENTIALS }}
          GMAIL_TOKEN: ${{ secrets.GMAIL_TOKEN }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update job state [skip ci]"
          file_pattern: state.json
